<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ECE 306 Dual Control</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #2f80ed;
      --bg: #0f172a;
      --fg: #f8fafc;
      --panel: #1e293b;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
      /* Prevent browser zooming/scrolling */
    }

    /* Top Bar for Status & Config */
    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .status-bar {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .config-panel {
      position: absolute;
      top: 3rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      /* Hidden by default */
      z-index: 20;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .config-panel.visible {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    input[type="text"] {
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
      color: inherit;
    }

    button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Main Control Area */
    main {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      /* Extra padding on sides for thumbs */
      position: relative;
    }

    /* Joystick Containers */
    .joystick-zone {
      width: 200px;
      height: 200px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .joystick-base {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(15, 23, 42, 0.8) 70%);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }

    .joystick-knob {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), var(--accent));
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      /* Let clicks pass through to base */
    }

    .label {
      position: absolute;
      bottom: -30px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      pointer-events: none;
    }

    /* Center Info (Optional) */
    .center-info {
      text-align: center;
      opacity: 0.5;
      font-size: 0.8rem;
      pointer-events: none;
    }

    @media (max-width: 600px) and (orientation: portrait) {

      /* Stack vertically in portrait if needed, though landscape is preferred */
      main {
        flex-direction: column;
        padding: 1rem;
      }

      .config-panel {
        width: 80%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ECE 306 Controller</h1>
    <div class="status-bar">
      <span id="status">Idle</span>
      <span id="gamepadStatus">No Gamepad</span>
      <button id="configToggle" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">Config</button>
    </div>
  </header>

  <div id="configPanel" class="config-panel">
    <label>Car Endpoint IP:</label>
    <input id="endpoint" type="text" value="http://192.168.4.1:8080" />
    <button id="saveEndpoint">Save</button>
  </div>

  <main>
    <!-- Left Joystick: Car Mode (Throttle + Turn) -->
    <div class="joystick-zone">
      <div class="joystick-base" id="stickLeft">
        <div class="joystick-knob" id="knobLeft"></div>
      </div>
      <div class="label">Drive & Turn</div>
    </div>

    <div class="center-info">
      <p>Left: Car Control</p>
      <p>Right: Tank Spin</p>
    </div>

    <!-- Right Joystick: Tank Mode (Spin) -->
    <div class="joystick-zone">
      <div class="joystick-base" id="stickRight">
        <div class="joystick-knob" id="knobRight"></div>
      </div>
      <div class="label">Tank Spin</div>
    </div>
  </main>

  <script>
    // --- Configuration & Constants ---
    const STORAGE_KEY = 'ece306-car-endpoint';
    const SEND_INTERVAL_MS = 150;
    const AXIS_SCALE = 1000;
    const SPEED_DEADBAND = 0.04;
    const TURN_DEADBAND = 0.08;
    const ROTATION_DEADBAND = 0.12;
    const TURN_RESPONSE_GAIN = 1.2;
    const TANK_TURN_GAIN = 0.1; // Scale tank spins for finer control
    const DIRECTION_CHANGE_PAUSE_MS = 220;

    // --- State ---
    const endpointInput = document.getElementById('endpoint');
    const statusEl = document.getElementById('status');
    const gamepadStatusEl = document.getElementById('gamepadStatus');
    const configPanel = document.getElementById('configPanel');

    let lastSentPayload = '';
    const lastAxisCommand = { x: 0, y: 0, active: 0 };
    let lastDirectionCommanded = 0;
    let directionHoldUntil = 0;
    let isSending = false;
    let activeGamepadIndex = null;

    // --- Joystick Class ---
    class TouchJoystick {
      constructor(baseId, knobId, onUpdate) {
        this.base = document.getElementById(baseId);
        this.knob = document.getElementById(knobId);
        this.onUpdate = onUpdate;
        this.activePointerId = null;
        this.state = { x: 0, y: 0, active: false };

        this.base.addEventListener('pointerdown', this.handleDown.bind(this));
        this.base.addEventListener('pointermove', this.handleMove.bind(this));
        this.base.addEventListener('pointerup', this.handleUp.bind(this));
        this.base.addEventListener('pointercancel', this.handleUp.bind(this));
      }

      handleDown(e) {
        e.preventDefault();
        this.base.setPointerCapture(e.pointerId);
        this.activePointerId = e.pointerId;
        this.updateFromEvent(e);
      }

      handleMove(e) {
        if (e.pointerId !== this.activePointerId) return;
        e.preventDefault();
        this.updateFromEvent(e);
      }

      handleUp(e) {
        if (e.pointerId !== this.activePointerId) return;
        e.preventDefault();
        this.base.releasePointerCapture(e.pointerId);
        this.activePointerId = null;
        this.reset();
      }

      updateFromEvent(e) {
        const rect = this.base.getBoundingClientRect();
        const radius = rect.width / 2;
        const centerX = rect.left + radius;
        const centerY = rect.top + radius;

        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const dist = Math.hypot(dx, dy);
        const maxDist = radius;

        const scale = dist > maxDist ? maxDist / dist : 1;
        const clampedX = dx * scale;
        const clampedY = dy * scale;

        // Update UI
        this.knob.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;

        // Normalize to -1..1
        // Note: Y is inverted in screen coords (Up is negative), so we negate it here to make Up positive
        this.state.x = clampedX / radius;
        this.state.y = -(clampedY / radius);
        this.state.active = true;

        this.onUpdate(this.state);
      }

      reset() {
        this.state = { x: 0, y: 0, active: false };
        this.knob.style.transform = `translate(-50%, -50%)`;
        this.onUpdate(this.state);
      }
    }

    // --- Control Logic ---
    let leftStickState = { x: 0, y: 0, active: false };
    let rightStickState = { x: 0, y: 0, active: false };

    // Initialize Joysticks
    new TouchJoystick('stickLeft', 'knobLeft', (state) => {
      leftStickState = { ...state };
    });

    new TouchJoystick('stickRight', 'knobRight', (state) => {
      rightStickState = { ...state };
    });

    // --- Input Mixing ---
    function getCombinedAxes() {
      // 1. Check Gamepad First (Priority)
      const gamepad = getActiveGamepad();
      if (gamepad) {
        return getGamepadAxes(gamepad);
      }

      // 2. Touch Controls
      // Left Stick: Car Mode (Throttle + Turn)
      // Right Stick: Tank Mode (Rotation)

      let axisX = 0;
      let axisY = 0;

      // Tank Mode (Right Stick)
      if (rightStickState.active && Math.abs(rightStickState.x) > ROTATION_DEADBAND) {
        // Tank spin: invert polarity and reduce gain for finer control
        axisX = -rightStickState.x * TANK_TURN_GAIN;
        axisY = 0;
      }
      // Car Mode (Left Stick)
      else if (leftStickState.active) {
        const throttle = leftStickState.y;
        const turn = leftStickState.x;

        if (Math.abs(throttle) > SPEED_DEADBAND) {
          axisY = throttle;
          // Polarity: Positive X -> Right Turn to match car expectation
          // Gain: 1.2 for full pivot
          const turnVal = Math.abs(turn) > TURN_DEADBAND
            ? Math.max(-1, Math.min(1, turn * TURN_RESPONSE_GAIN))
            : 0;
          axisX = turnVal;
        }
      }

      return { axisX, axisY };
    }

    function getGamepadAxes(pad) {
      // PS4 Mapping: Left Stick (0,1), Right Stick (2,3), L2(6), R2(7)
      // Use existing logic for PS4
      const leftX = pad.axes[0];
      const rightX = pad.axes[2];
      const l2 = pad.buttons[6].value;
      const r2 = pad.buttons[7].value;

      let forward = r2 > 0.05 ? r2 : 0;
      let reverse = l2 > 0.05 ? l2 : 0;

      // Cancel out if both pressed
      if (forward > 0 && reverse > 0) {
        if (forward >= reverse) reverse = 0;
        else forward = 0;
      }

      const throttle = forward - reverse;
      const rotation = rightX;
      const turnOffset = leftX;

      let axisX = 0;
      let axisY = 0;

      const hasThrottle = Math.abs(throttle) > SPEED_DEADBAND;
      const wantsRotation = Math.abs(rotation) > ROTATION_DEADBAND;

      if (wantsRotation && !hasThrottle) {
        // Tank Turn (invert polarity and apply gain)
        axisX = -rotation * TANK_TURN_GAIN;
        axisY = 0;
      } else if (hasThrottle) {
        // Car Mode
        axisY = throttle;
        const turnVal = Math.abs(turnOffset) > TURN_DEADBAND
          ? Math.max(-1, Math.min(1, turnOffset * TURN_RESPONSE_GAIN))
          : 0;
        axisX = turnVal; // Positive -> Right Turn
      }

      return { axisX, axisY };
    }

    // --- Network & Loop ---
    function normalizeEndpoint(val) {
      let s = val.trim();
      if (!s) return '';
      if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
      return s.replace(/\/+$/, '');
    }

    // Load saved endpoint
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) endpointInput.value = saved;

    document.getElementById('saveEndpoint').addEventListener('click', () => {
      const url = normalizeEndpoint(endpointInput.value);
      endpointInput.value = url;
      localStorage.setItem(STORAGE_KEY, url);
      configPanel.classList.remove('visible');
    });

    document.getElementById('configToggle').addEventListener('click', () => {
      configPanel.classList.toggle('visible');
    });

    function enforceInterlock(axisY) {
      const now = Date.now();
      let reqDir = 0;
      if (Math.abs(axisY) > SPEED_DEADBAND) reqDir = axisY > 0 ? 1 : -1;

      if (reqDir !== 0 && lastDirectionCommanded !== 0 && reqDir !== lastDirectionCommanded && directionHoldUntil <= now) {
        directionHoldUntil = now + DIRECTION_CHANGE_PAUSE_MS;
        lastDirectionCommanded = 0;
      }

      const cooling = directionHoldUntil > now;
      if (cooling) return { axisX: 0, axisY: 0, cooling: true };

      if (reqDir !== 0) lastDirectionCommanded = reqDir;
      else if (Math.abs(axisY) <= SPEED_DEADBAND) {
        lastDirectionCommanded = 0;
        directionHoldUntil = 0;
      }

      return { cooling: false };
    }

    async function sendCommand(axes, cooling) {
      const endpoint = normalizeEndpoint(endpointInput.value);
      if (!endpoint) return;

      const active = Math.abs(axes.axisY) > SPEED_DEADBAND || Math.abs(axes.axisX) > TURN_DEADBAND;
      const payload = new URLSearchParams({
        x: Math.round(axes.axisX * AXIS_SCALE),
        y: Math.round(axes.axisY * AXIS_SCALE),
        active: active ? 1 : 0
      }).toString();

      // De-dupe logic
      if (!active && !cooling && payload === lastSentPayload) {
        statusEl.textContent = 'Idle';
        return;
      }

      lastSentPayload = payload;

      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 1000);
        const res = await fetch(`${endpoint}/api/joystick`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: payload,
          signal: controller.signal
        });
        if (res.ok) statusEl.textContent = active ? 'Sending...' : 'Idle';
        else statusEl.textContent = `Error ${res.status}`;
      } catch (e) {
        statusEl.textContent = 'Link Error';
      }
    }

    async function controlLoop() {
      if (isSending) return;
      isSending = true;
      try {
        const rawAxes = getCombinedAxes();
        const interlock = enforceInterlock(rawAxes.axisY);
        const finalAxes = interlock.cooling ? { axisX: 0, axisY: 0 } : rawAxes;

        await sendCommand(finalAxes, interlock.cooling);
      } finally {
        isSending = false;
      }
    }

    setInterval(controlLoop, SEND_INTERVAL_MS);

    // --- Gamepad Support ---
    function getActiveGamepad() {
      if (!navigator.getGamepads) return null;
      const pads = navigator.getGamepads();
      if (activeGamepadIndex !== null && pads[activeGamepadIndex]) return pads[activeGamepadIndex];
      for (let i = 0; i < pads.length; i++) {
        if (pads[i]) {
          activeGamepadIndex = i;
          return pads[i];
        }
      }
      return null;
    }

    window.addEventListener('gamepadconnected', (e) => {
      activeGamepadIndex = e.gamepad.index;
      gamepadStatusEl.textContent = 'Gamepad Active';
    });
    window.addEventListener('gamepaddisconnected', (e) => {
      if (activeGamepadIndex === e.gamepad.index) activeGamepadIndex = null;
      gamepadStatusEl.textContent = 'No Gamepad';
    });

  </script>
</body>

</html>
